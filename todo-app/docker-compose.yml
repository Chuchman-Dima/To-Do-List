services:
  backend:
    build: ./backend
    container_name: todo_backend
    ports:
      - "8081:8081"
    volumes:
      - ./backend/data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////app/data/todo.db

  frontend:
    build: ./frontend
    container_name: todo_frontend
    ports:
      - "8502:8501"
    environment:
      - API_URL=http://backend:8081
    depends_on:
      - backend